# ==============================================================================
# DataOps Backend Financial Trading — Unified Production Infrastructure
# ==============================================================================

networks:
  dataops-internal-net:
    driver: bridge
    name: dataops-internal-net

services:

  # ─── KAFKA BROKER 1 (KRaft Mode) ───────────────────────────────────────────
  kafka1:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka1
    container_name: dataops-kafka1
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka1:29092,CONTROLLER://kafka1:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,EXTERNAL://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka1-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: "1536M"
        reservations:
          cpus: "0.50"
          memory: "512M"

  # ─── KAFKA BROKER 2 (KRaft Mode) ───────────────────────────────────────────
  kafka2:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka2
    container_name: dataops-kafka2
    restart: unless-stopped
    networks:
      - dataops-internal-net
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka2:29092,CONTROLLER://kafka2:9093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,EXTERNAL://kafka2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka2-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:9093", "1", "30"]

  # ─── KAFKA BROKER 3 (KRaft Mode) ───────────────────────────────────────────
  kafka3:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka3
    container_name: dataops-kafka3
    restart: unless-stopped
    networks:
      - dataops-internal-net
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka3:29092,CONTROLLER://kafka3:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,EXTERNAL://kafka3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka3-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:9094", "1", "30"]

  # ─── SCHEMA REGISTRY ───────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: dataops-schema-registry
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.20"
          memory: "256M"

  # ─── KAFKA UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dataops-kafka-ui
    restart: unless-stopped
    networks:
      - dataops-internal-net
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dataops-financial-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"

  # ─── MINIO (S3 Lakehouse Storage) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: dataops-minio
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # ─── MYSQL (User, Accounting, Indicators DB) ───────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: dataops-mysql
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: binance_analytics
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # ─── REDIS (High Speed Real-time Cache) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dataops-redis
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.10"
          memory: "128M"

  # ─── INFLUXDB (Time-series Market Metrics & Orderbook) ─────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: dataops-influxdb
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
      DOCKER_INFLUXDB_INIT_ORG: binance-vps-platform
      DOCKER_INFLUXDB_INIT_BUCKET: market-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # ─── GRAFANA (Monitoring & Trading Visualizations) ─────────────────────────
  grafana:
    image: grafana/grafana:10.0.0
    container_name: dataops-grafana
    restart: unless-stopped
    networks:
      - dataops-internal-net
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../grafana/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"

  # dataops-stream-producer disabled — Kafka broker format issue in Go code
  # dataops-stream-producer:
    build:
      context: ../dataops_stream_producer
      dockerfile: Dockerfile
    container_name: dataops-stream-producer
    restart: unless-stopped
    networks:
      - dataops-internal-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      KAFKA_URL: kafka1:29092,kafka2:29092,kafka3:29092
      REDIS_ADDRESS: redis:6379
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Binance WebSocket
      BINANCE_WS_URL: wss://stream.binance.com:9443/ws
      BINANCE_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
      # TCBS iFlash Open API (thay thế VPS)
      TCBS_BASE_URL: https://openapi.tcbs.com.vn
      TCBS_API_KEY: ""
      TCBS_JWT_TOKEN: ""
      TCBS_SYMBOLS: VCB,VHM,TCB,VIC,HPG,MSN,VNM,MBB,CTG,BID
      TCBS_INDEXES: HOSE,VN30,HNX
      TCBS_BSA_INVESTOR_TYPE: all
      TCBS_INTRADAY_MAX_PAGES: "5"
      MODE: prod
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.10"
          memory: "128M"

  # ─── BACKEND ANALYTICS API (Go REST API) ───────────────────────────────────
  dataops-backend-api:
    build:
      context: ../dataops_backend_api
      dockerfile: Dockerfile
    container_name: dataops-backend-api
    restart: unless-stopped
    networks:
      - dataops-internal-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # MySQL DSN — khớp với configuration.go cfg.MySQL.DNS
      MYSQL_DNS: root:root123@tcp(mysql:3306)/binance_analytics?parseTime=true
      REDIS_ADDRESS: redis:6379
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-auth-token
      INFLUXDB_ORG: binance-vps-platform
      INFLUXDB_BUCKET: market-data
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      # JWT Auth
      JWT_SECRET: ""
      JWT_REFRESH_SECRET: ""
      # TCBS iFlash Open API
      TCBS_BASE_URL: https://openapi.tcbs.com.vn
      TCBS_API_KEY: ""
      TCBS_JWT_TOKEN: ""
      MODE: prod
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.20"
          memory: "256M"

  # ─── BATCH LAKEHOUSE PIPELINE (Python + PySpark + Delta Lake) ──────────────
  dataops-batch-api:
    build:
      context: ../dataops_batch_api
      dockerfile: Dockerfile
    container_name: dataops-batch-api
    restart: unless-stopped
    networks:
      - dataops-internal-net
    depends_on:
      minio:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_ENDPOINT_URL: http://minio:9000
      DELTA_LAKE_S3_PATH: s3a://binance-datalake/
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: "2048M"
        reservations:
          cpus: "0.50"
          memory: "512M"

  # ─── SPARK MASTER (Processing Cluster) ─────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: dataops-spark-master
    restart: unless-stopped
    networks:
      - dataops-internal-net
    ports:
      - "8095:8080"
      - "7087:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"
      - "--host"
      - "spark-master"
      - "--port"
      - "7077"
      - "--webui-port"
      - "8080"
    volumes:
      - ./jars:/opt/spark/custom_jars
      - ./data:/opt/spark/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1536M"
        reservations:
          cpus: "0.50"
          memory: "512M"

  # ─── SPARK WORKER ──────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    container_name: dataops-spark-worker
    restart: unless-stopped
    networks:
      - dataops-internal-net
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4g
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
      - "-c"
      - "2"
      - "-m"
      - "4g"
    volumes:
      - ./jars:/opt/spark/custom_jars
      - ./data:/opt/spark/data
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "2560M"
        reservations:
          cpus: "1.00"
          memory: "1024M"

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  minio-data:
  mysql-data:
  redis-data:
  influxdb-data:
  grafana-data:
