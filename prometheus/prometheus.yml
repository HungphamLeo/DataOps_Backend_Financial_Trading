global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # ST14: scrape the in-stream data contract violation counter.
  - job_name: dataops-stream-producer
    metrics_path: /metrics
    static_configs:
      - targets: ["dataops-stream-producer:2112"]