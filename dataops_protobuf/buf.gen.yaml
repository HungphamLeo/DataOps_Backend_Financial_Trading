# ST10: Pin generators so Go and Python bindings are reproducible from the canonical schemas.
# Keep generated files here to avoid mixing generated code with handwritten service code.
version: v1

plugins:
  # ST10: Generate Go message types from the canonical .proto definitions.
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen/go
    opt:
      - paths=source_relative
  # ST10: Generate Go gRPC clients and servers for declared services.
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative
  # ST10: Generate Python message types for Python consumers.
  - remote: buf.build/protocolbuffers/python:v29.3
    out: gen/python
  # ST10: Generate Python gRPC clients and servers for declared services.
  - remote: buf.build/grpc/python:v1.68.1
    out: gen/python
