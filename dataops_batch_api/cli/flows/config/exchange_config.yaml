# exchange_config.yaml — Binance + TCBS Batch Pipeline Configuration
# Single source of truth cho tất cả tham số runtime của pipeline.
# Thay đổi tại đây để điều chỉnh hành vi pipeline mà không cần sửa code.

# ─── Binance Instruments ──────────────────────────────────────────────────────
binance:
  base_url: "https://api.binance.com/api/v3"
  rate_limit_interval_sec: 0.1   # 100ms giữa các request
  request_timeout_sec: 15
  retry_attempts: 5
  retry_max_wait_sec: 30

  instruments:
    spot:
      - "BTCUSDT"
      - "ETHUSDT"
      - "SOLUSDT"
      - "BNBUSDT"
      - "XRPUSDT"

  intervals:
    default: "1m"
    available:
      - "1m"
      - "5m"
      - "1h"
      - "4h"
      - "1d"

# ─── TCBS iFlash Securities ───────────────────────────────────────────────────
# Reference: openapi-v1.0.0.json — TCBS iFlash Open API v1.0.0
# Auth: POST /gaia/v1/oauth2/openapi/token (apiKey + Smart OTP → JWT)
# Enums: xem cli/ingestion/sources/tcbs_constants.yaml — không hardcode
tcbs:
  base_url: "https://openapi.tcbs.com.vn"
  request_timeout_sec: 15
  retry_attempts: 3
  retry_max_wait_sec: 15
  symbols_per_batch: 50        # Batch size an toàn cho tickerCommons (undocumented limit)

  # Danh sách index baskets cần ingest market snapshot
  # Giá trị phải khớp với index_codes trong tcbs_constants.yaml
  default_indexes:
    - "HOSE"
    - "VN30"
    - "HNX"

  # Danh sách mã cụ thể cần ingest BSA (supply/demand analytics)
  # Empty → skip BSA ingestion
  bsa_tickers:
    - "VCB"
    - "VHM"
    - "TCB"
    - "VIC"
    - "HPG"
    - "MSN"
    - "VNM"
    - "MBB"
    - "CTG"
    - "BID"

  # BSA investor type cần thu thập — xem bsa_investor_types trong tcbs_constants.yaml
  bsa_investor_type: "all"

  # Intraday tick history: số trang tối đa mỗi ticker (1 page = 100 ticks)
  intraday_max_pages: 5

  # Số tài khoản margin để ingest risk snapshot (tcbs_margin_job).
  # Override bằng env TCBS_MARGIN_ACCOUNTS (comma-separated). Empty → skip.
  margin_accounts: []

  # Benchmark name → TCBS basket index (benchmark_index_job).
  # TCBS OpenAPI không có index level → lưu basket aggregate.
  benchmark_baskets:
    VNINDEX: "HOSE"
    VN30:    "VN30"

  # Token management
  token_refresh_threshold_sec: 3600   # Cảnh báo refresh khi token > 1h tuổi

# ─── Delta Lake Paths ─────────────────────────────────────────────────────────
delta:
  bucket: "binance-datalake"
  bronze:
    binance_spot:    "s3://binance-datalake/delta/bronze/binance_candles_spot"
    tcbs_market:     "s3://binance-datalake/delta/bronze/tcbs_market"
    tcbs_bsa:        "s3://binance-datalake/delta/bronze/tcbs_bsa"
    tcbs_intraday:   "s3://binance-datalake/delta/bronze/tcbs_intraday"
  silver:
    vwap:           "s3://binance-datalake/delta/silver/vwap"
    funding_stats:  "s3://binance-datalake/delta/silver/funding_stats"
  compact_target_size_mb: 128

# ─── Spark Streaming ──────────────────────────────────────────────────────────
spark_streaming:
  kafka_topic_trade_ticks:   "binance.trade.ticks"
  kafka_topic_funding_rates: "binance.funding.rates"
  kafka_topic_alert_funding: "binance.alerts.funding-anomaly"

  vwap:
    window_duration:   "5 minutes"
    slide_duration:    "1 minute"
    watermark:         "30 seconds"
    checkpoint:        "/tmp/spark_checkpoints/vwap"

  funding_anomaly:
    window_duration:   "1 hour"
    slide_duration:    "10 minutes"
    watermark:         "1 minute"
    z_score_threshold: 2.5
    checkpoint:        "/tmp/spark_checkpoints/funding_anomaly"

# ─── Backfill ─────────────────────────────────────────────────────────────────
backfill:
  default_days_back: 30
  max_days_back:     1095      # 3 năm
  candles_per_request: 300
  max_workers: 4

# ─── Kafka ────────────────────────────────────────────────────────────────────
kafka:
  bootstrap_servers: "localhost:9092"   # override bằng env KAFKA_BROKERS
  topic_ohlcv_batch: "binance.ohlcv.batch"
