# exchange_config.yaml — Binance + VPS Batch Pipeline Configuration
# Single source of truth cho tất cả tham số runtime của pipeline.
# Thay đổi tại đây để điều chỉnh hành vi pipeline mà không cần sửa code.

# ─── Binance Instruments ──────────────────────────────────────────────────────
binance:
  base_url: "https://api.binance.com/api/v3"
  rate_limit_interval_sec: 0.1   # 100ms giữa các request
  request_timeout_sec: 15
  retry_attempts: 5
  retry_max_wait_sec: 30

  instruments:
    spot:
      - "BTCUSDT"
      - "ETHUSDT"
      - "SOLUSDT"
      - "BNBUSDT"
      - "XRPUSDT"
    futures:
      - "BTCUSDT"
      - "ETHUSDT"
      - "SOLUSDT"

  intervals:
    default: "1m"
    available:
      - "1m"
      - "5m"
      - "1h"
      - "4h"
      - "1d"

# ─── VPS Securities ───────────────────────────────────────────────────────────
vps:
  base_url: "https://bgapidatafeed.vps.com.vn"
  request_timeout_sec: 10
  retry_attempts: 3
  retry_max_wait_sec: 10
  symbols_per_batch: 200       # VPS API giới hạn ~200 symbols/request
  exchange: "HOSE"             # HOSE only (HNX/UPCOM out of scope)

# ─── Delta Lake Paths ─────────────────────────────────────────────────────────
delta:
  bucket: "binance-datalake"
  bronze:
    binance_spot:    "s3://binance-datalake/delta/bronze/binance_candles_spot"
    binance_futures: "s3://binance-datalake/delta/bronze/binance_candles_futures"
    vps_market:      "s3://binance-datalake/delta/bronze/vps_market"
  silver:
    vwap:           "s3://binance-datalake/delta/silver/vwap"
    funding_stats:  "s3://binance-datalake/delta/silver/funding_stats"
  compact_target_size_mb: 128

# ─── Spark Streaming ──────────────────────────────────────────────────────────
spark_streaming:
  kafka_topic_trade_ticks:   "binance.trade.ticks"
  kafka_topic_funding_rates: "binance.funding.rates"
  kafka_topic_alert_funding: "binance.alerts.funding-anomaly"

  vwap:
    window_duration:   "5 minutes"
    slide_duration:    "1 minute"
    watermark:         "30 seconds"
    checkpoint:        "/tmp/spark_checkpoints/vwap"

  funding_anomaly:
    window_duration:   "1 hour"
    slide_duration:    "10 minutes"
    watermark:         "1 minute"
    z_score_threshold: 2.5
    checkpoint:        "/tmp/spark_checkpoints/funding_anomaly"

# ─── Backfill ─────────────────────────────────────────────────────────────────
backfill:
  default_days_back: 30
  max_days_back:     1095      # 3 năm
  candles_per_request: 300
  max_workers: 4

# ─── Kafka ────────────────────────────────────────────────────────────────────
kafka:
  bootstrap_servers: "localhost:9092"   # override bằng env KAFKA_BROKERS
  topic_ohlcv_batch: "binance.ohlcv.batch"
