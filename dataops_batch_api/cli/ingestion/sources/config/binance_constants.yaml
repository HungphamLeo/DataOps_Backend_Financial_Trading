# ─── Rate Limits ──────────────────────────────────────────────────────────────
rate_limits:
  klines_per_minute:        1200   # requests/min per IP (public)
  orders_per_second:        10     # orders/sec (private)
  orders_per_day:           100000 # orders/24h
  recommended_interval_sec: 0.1    # 100ms giữa các request (conservative)
  weight_per_klines_request: 2     # request weight

# ─── Error Codes (HTTP 4xx với Binance error format) ─────────────────────────
# Response: {"code": -1121, "msg": "Invalid symbol."}
error_codes:
  "-1000": "UNKNOWN — An unknown error occurred"
  "-1100": "ILLEGAL_CHARS — Illegal characters found in parameter"
  "-1121": "INVALID_SYMBOL — Invalid symbol"
  "-1130": "INVALID_PARAMETER — An invalid value was sent for a param"
  "-2010": "NEW_ORDER_REJECTED — New order rejected"
  "-2011": "CANCEL_REJECTED — Cancel order rejected"
  "-2013": "NO_SUCH_ORDER — Order does not exist"
  "-2014": "BAD_API_KEY_FMT — API-key format invalid"
  "-2015": "REJECTED_MBX_KEY — Invalid API-key, IP, or permissions"

# ─── Order Types (Spot) ───────────────────────────────────────────────────────
order_types_spot:
  LIMIT:             "Limit order"
  MARKET:            "Market order"
  STOP_LOSS:         "Stop loss"
  STOP_LOSS_LIMIT:   "Stop loss limit"
  TAKE_PROFIT:       "Take profit"
  TAKE_PROFIT_LIMIT: "Take profit limit"
  LIMIT_MAKER:       "Limit maker"

# ─── Order Sides ─────────────────────────────────────────────────────────────
order_sides:
  BUY:  "Buy"
  SELL: "Sell"

# ─── Order Status ─────────────────────────────────────────────────────────────
order_status:
  NEW:              "Order accepted"
  PARTIALLY_FILLED: "Partially filled"
  FILLED:           "Completely filled"
  CANCELED:         "Canceled"
  PENDING_CANCEL:   "Pending cancel"
  REJECTED:         "Rejected"
  EXPIRED:          "Expired"
