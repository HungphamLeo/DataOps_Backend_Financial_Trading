# ─── Trade Tick Field Mapping ─────────────────────────────────────────────────
# Binance @trade stream message payload (combined stream: msg.data)
trade_tick_fields:
  event_type:      "e"    # string — "trade"
  event_time:      "E"    # int64 ms — event time
  symbol:          "s"    # string — e.g. "BTCUSDT"
  trade_id:        "t"    # int64 — trade ID (không phải string như OKX)
  price:           "p"    # string — price
  quantity:        "q"    # string — quantity (base asset)
  buyer_order_id:  "b"    # int64 — buyer order ID
  seller_order_id: "a"    # int64 — seller order ID
  trade_time:      "T"    # int64 ms — trade time
  is_buyer_maker:  "m"    # bool — false = buy (taker), true = sell (taker)
  # Logic: side = "sell" if m=true else "buy"

