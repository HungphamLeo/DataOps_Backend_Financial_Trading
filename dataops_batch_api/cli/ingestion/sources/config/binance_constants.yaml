  "12h": "12 hours"
  "1d":  "1 day"
  "3d":  "3 days"
  "1w":  "1 week"
  "1M":  "1 month"

# ─── Kline Response Field Indices ────────────────────────────────────────────
# Binance /klines response là array of arrays — index-based access
# QUAN TRỌNG: vol_ccy là row[7] (quoteAssetVolume), KHÔNG phải row[6]
kline_fields:
  open_time:              0   # Unix ms — candle open time
  open:                   1   # string — open price
  high:                   2   # string — high price
  low:                    3   # string — low price
  close:                  4   # string — close price
  volume:                 5   # string — base asset volume (e.g. BTC)
  close_time:             6   # Unix ms — candle close time
  quote_asset_volume:     7   # string — quote asset volume (USDT) — dùng làm vol_ccy
  num_trades:             8   # int — number of trades
  taker_buy_base_volume:  9   # string — taker buy base asset volume
  taker_buy_quote_volume: 10  # string — taker buy quote asset volume
  ignore:                 11  # string — unused field

