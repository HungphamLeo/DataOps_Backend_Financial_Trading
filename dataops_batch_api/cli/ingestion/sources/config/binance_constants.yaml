# ─── Private Endpoints (requires X-MBX-APIKEY + signature) ───────────────────
private_endpoints:
  # Account
  account_info:       "/account"                # GET — account balances + status
  my_trades:          "/myTrades"               # GET — trade history
  order_history:      "/allOrders"              # GET — all orders
  open_orders:        "/openOrders"             # GET — current open orders

  # Order Management
  order_place:        "/order"                  # POST — place order
  order_cancel:       "/order"                  # DELETE — cancel order
  order_status:       "/order"                  # GET — query order status
  batch_orders:       "/batchOrders"            # POST/DELETE — batch operations

# ─── Kline / OHLCV Intervals ─────────────────────────────────────────────────
# Dùng cho param `interval` trong /klines
kline_intervals:
